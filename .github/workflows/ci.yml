name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:

permissions:
  contents: read

jobs:
  tests:
    name: tests
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Run Swift tests
        run: swift test

      - name: Build the complete app without signing
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild build \
            -project HSReconnect.xcodeproj \
            -scheme HSReconnect \
            -configuration Debug \
            -destination 'generic/platform=macOS' \
            CODE_SIGNING_ALLOWED=NO

      - name: Verify source and packaging contracts
        run: |
          chmod +x Scripts/*.sh Scripts/Installer/* Tests/*/run-tests.sh
          zsh -n Scripts/*.sh Scripts/Installer/* Tests/*/run-tests.sh
          Scripts/verify-vendor.sh
          Scripts/verify-system-extension-config.sh
          Tests/LobbyConcurrency/run-tests.sh
          Tests/Packaging/run-tests.sh
          Tests/ReleaseContract/run-tests.sh
          Tests/ReleaseValidation/run-tests.sh

  intel-tests:
    name: intel-tests
    runs-on: macos-15-intel
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Confirm Intel runner
        run: test "$(uname -m)" = "x86_64"

      - name: Run Swift tests
        run: swift test
